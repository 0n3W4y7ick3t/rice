# Hyprland config, ported from dwm (binds mirror the old dwm config.h).
# Machine-specific bits (monitors, env, input quirks) live in machine.conf,
# selected per machine by yadm class alternates.

# $mod before the source: machine.conf binds keys too (hyprexpo on the
# desktop), and Hyprland substitutes a $var at parse time -- a bind sourced
# before the definition gets the literal string "$mod" and silently never fires.
$mod = SUPER

# Anything that is true of one machine only -- monitors, GPU env, input
# quirks, distro-specific autostarts and plugins -- lives here, picked by
# yadm class. Nothing below this line may assume a distro.
source = ~/.config/hypr/machine.conf

# Cursor theme, fleet-wide (the package comes from the system layer:
# @hyprland set on Gentoo, AUR list on Arch). XCURSOR_* covers Hyprland and
# XWayland; GTK apps read gtk-cursor-theme-name from gtk-3.0/settings.ini.
env = XCURSOR_THEME,macOS
# nominal size is doubled by the scale-2 monitors; 20 renders at 40px
env = XCURSOR_SIZE,20

# Define the browser here rather than leaning on $BROWSER from the environment.
# Hyprland substitutes $VARS when it *parses* the config, so an env var is
# frozen to whatever the value was when the compositor started -- editing
# shell/profile afterwards has no effect until a full restart, and if the name
# is stale the bind silently launches a binary that does not exist. That is
# exactly what happened: $mod+W was baked to "firefox", which is not installed.
$browser = google-chrome-stable

general {
    layout = master
    border_size = 2
    # order: top, right, bottom, left
    gaps_in = 4 3 4 3
    gaps_out = 10 8 10 8
    col.active_border = rgb(7AA2F7)
    col.inactive_border = rgb(1A1B26)
}

master {
    mfact = 0.55
    new_status = master
    new_on_top = true
    slave_count_for_center_master = 0
}

dwindle {
}

decoration {
    rounding = 0
    blur {
        enabled = true
        # picom used gaussian size=40 deviation=20 ("frosted glass"). size 8 +
        # passes 3 smeared the backdrop flat, so with kitty at 0.8 opacity there
        # was nothing recognisable behind the text. Smaller radius keeps some
        # structure; brightness/vibrancy stop the result washing out to grey.
        size = 6
        passes = 3
        brightness = 0.8
        vibrancy = 0.35
        contrast = 1.0
        noise = 0.02
    }
}

misc {
    enable_swallow = true
    swallow_regex = ^(kitty)$
    vrr = 0
    # let apps raise themselves (dunst click -> slack focuses its window)
    focus_on_activate = true
    # yadm alt unlinks machine.conf for an instant; an autoreload landing in
    # that gap fails the source= glob and drops every monitor rule. Reloads
    # are explicit only ($mod+F5, and the yadm hooks after alt).
    disable_autoreload = true
}

input {
    repeat_rate = 50
    repeat_delay = 300
}

cursor {
    inactive_timeout = 3
}

# No persistent:true on 1-9 so the bar lists only occupied workspaces.

# Scratchpads (dwm's spterm/spcalc)
workspace = special:spterm, on-created-empty:kitty --class spterm
workspace = special:spcalc, on-created-empty:kitty --class spcalc -e bc -lq
# Hyprland 0.53 overhauled this syntax: the match comes first and every rule
# takes a value. The pre-0.53 form (`windowrule = float, class:^(x)$`) parses
# each comma-separated token as a bare field and errors with
# "invalid field float: missing a value", which is what raised the error overlay.
windowrule = match:class ^(spterm)$, float on, center on, size 1150 720
windowrule = match:class ^(spcalc)$, float on, center on, size 480 420
windowrule = match:class ^([Gg]imp)$, workspace 9
windowrule = match:class ^(floatterm)$, float on

# Autostart
exec-once = waybar
exec-once = hyprpaper
exec-once = sleep 2 && setbg
exec-once = dunst
exec-once = fcitx5 -d
exec-once = gammastep
exec-once = mpd
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# polkitd answers on D-Bus but never draws anything: without an agent every
# GUI privilege prompt fails with no visible reason at all.
exec-once = /usr/lib/hyprpolkitagent

# Window/stack management
bind = $mod, J, cyclenext,
bind = $mod, K, cyclenext, prev
bind = $mod SHIFT, J, swapnext,
bind = $mod SHIFT, K, swapnext, prev
bind = $mod SHIFT, V, layoutmsg, focusmaster
bind = $mod, space, layoutmsg, swapwithmaster
bind = $mod SHIFT, space, togglefloating,
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 0
bind = $mod, H, layoutmsg, mfact -0.05
bind = $mod, L, layoutmsg, mfact +0.05
bind = $mod, O, layoutmsg, addmaster
bind = $mod SHIFT, O, layoutmsg, removemaster
bind = $mod, S, pin,
bind = $mod, B, exec, pkill -SIGUSR1 waybar

# Layouts (dwm-style glyphs published by hypr-layout)
bind = $mod, T, exec, hypr-layout tile
bind = $mod SHIFT, T, exec, hypr-layout bstack
bind = $mod, Y, exec, hypr-layout spiral
bind = $mod SHIFT, Y, exec, hypr-layout dwindle
bind = $mod, U, exec, hypr-layout deck
bind = $mod SHIFT, U, fullscreen, 1
bind = $mod, I, exec, hypr-layout centered
bind = $mod SHIFT, I, exec, hypr-layout centered

# Gaps
bind = $mod, A, exec, hypr-gaps toggle
bind = $mod SHIFT, A, exec, hypr-gaps default
bind = $mod, Z, exec, hypr-gaps dec
bind = $mod, X, exec, hypr-gaps inc
bind = $mod SHIFT, Z, exec, hypr-gaps smart

# Workspaces 1-9 (+Shift silent move)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod, 0, exec, hypr-windows
# $mod SHIFT, 0 is hyprexpo's overview -- bound in machine.conf where the
# plugin actually exists (desktop only).
bind = $mod, Tab, workspace, previous
bind = $mod, backslash, workspace, previous
bind = $mod, G, workspace, r-1
bind = $mod, semicolon, workspace, r+1
bind = $mod SHIFT, G, movetoworkspace, r-1
bind = $mod SHIFT, semicolon, movetoworkspace, r+1
bind = $mod, Prior, workspace, r-1
bind = $mod, Next, workspace, r+1
bind = $mod SHIFT, Prior, movetoworkspace, r-1
bind = $mod SHIFT, Next, movetoworkspace, r+1

# Monitors
bind = $mod, left, focusmonitor, -1
bind = $mod, right, focusmonitor, +1
bind = $mod SHIFT, left, movewindow, mon:-1
bind = $mod SHIFT, right, movewindow, mon:+1

# Terminals and scratchpads
bind = $mod, Return, exec, kitty
bind = ALT SHIFT, Return, exec, samedir
bind = $mod SHIFT, Return, togglespecialworkspace, spterm
bind = $mod, apostrophe, togglespecialworkspace, spcalc

# Launchers and apps
bind = $mod, D, exec, wmenu-run -f 'FiraCode Nerd Font 15' -N 1A1B26 -n A9B1D6 -S 7AA2F7 -s 1A1B26
bind = $mod SHIFT, D, exec, passmenu
bind = $mod, W, exec, $browser
bind = $mod, E, exec, kitty -e lf
bind = $mod, R, exec, kitty -e htop
bind = $mod SHIFT, R, exec, ranbg
bind = $mod, C, exec, code
bind = $mod, N, exec, kitty -e nvim -c VimwikiIndex
bind = $mod SHIFT, N, exec, kitty -e nvim -c VimwikiDiaryIndex
bind = $mod, M, exec, kitty -e ncmpcpp
bind = $mod SHIFT, B, exec, wmenubooks

# Media
bind = $mod, P, exec, playback-control toggle
bind = $mod, comma, exec, playback-control prev
bind = $mod, period, exec, playback-control next
bind = $mod, bracketleft, exec, mpc seek -10
bind = $mod, bracketright, exec, mpc seek +10

# Volume
bind = $mod SHIFT, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && barsig 10
bind = $mod, minus, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%- && barsig 10
bind = $mod SHIFT, minus, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 10%- && barsig 10
bind = $mod, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%+ && barsig 10
bind = $mod SHIFT, equal, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 10%+ && barsig 10

# System
bind = $mod, BackSpace, exec, sysact
bind = $mod SHIFT, BackSpace, exec, hyprctl reload
bind = $mod SHIFT, L, exec, blurlock
bind = $mod, grave, exec, wmenuunicode
bind = $mod, Insert, exec, snippets-type
bind = $mod, V, exec, clippick
bind = $mod, F2, exec, kitty --class floatterm -e less -Srf ~/.local/share/weatherreport
bind = $mod, F4, exec, kitty -e pulsemixer
bind = $mod, F5, exec, hyprctl reload
bind = $mod, F6, exec, wmenubluetooth
bind = $mod, F8, exec, mw -Y
bind = $mod, F9, exec, wmenumount
bind = $mod, F10, exec, wmenuumount
bind = $mod, F11, exec, mpv --untimed --no-cache --no-osc --no-input-default-bindings --profile=low-latency --input-conf=/dev/null --title=webcam $(ls /dev/video[0,2,4,6,8] | tail -n 1)

# Screenshots and recording
bind = , Print, exec, screenshot region
bind = $mod SHIFT, S, exec, screenshot region
bind = $mod, Print, exec, wmenurecord
bind = $mod, Delete, exec, wmenurecord kill

# XF86 keys
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && barsig 10
bindle = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%+ && barsig 10
bindle = , XF86AudioLowerVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 3%- && barsig 10
bindl = , XF86AudioPrev, exec, playback-control prev
bindl = , XF86AudioNext, exec, playback-control next
bindl = , XF86AudioPlay, exec, mpc play
bindl = , XF86AudioPause, exec, mpc pause
bindl = , XF86AudioStop, exec, mpc stop
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindle = , XF86MonBrightnessUp, exec, brightnessctl set +15% && barsig 3
bindle = , XF86MonBrightnessDown, exec, brightnessctl set 15%- && barsig 3

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
bind = $mod, mouse_up, exec, hypr-gaps inc
bind = $mod, mouse_down, exec, hypr-gaps dec
