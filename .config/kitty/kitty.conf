# kitty config, tuned for parity with the retired st fork.

# Font: the "Freeze" build has the stylistic sets baked in. If it is not
# installed, fall back to stock FiraCode Nerd Font plus font_features.
font_family      FiraCode Nerd Font Freeze
# font_family      FiraCode Nerd Font
# font_features    FiraCodeNF-Reg +ss03 +ss07 +ss09 +cv25 +cv26 +cv32
font_size        12.0

background_opacity          0.65
dynamic_background_opacity  yes
scrollback_lines            10000
cursor_shape                block
shell_integration           enabled
allow_remote_control        socket-only
listen_on                   unix:@kitty
enable_audio_bell           no
visual_bell_duration        0
confirm_os_window_close     0

# Tokyo Night, verbatim from the old xresources
foreground            #A9B1D6
background            #1A1B26
cursor                #A9B1D6
selection_background  #3A3F4B
color0   #1A1B26
color8   #4E5173
color1   #F7768E
color9   #E06C75
color2   #E0AF68
color10  #D19A66
color3   #9ECE6A
color11  #98C379
color4   #7AA2F7
color12  #61AFEF
color5   #9A7ECC
color13  #C678DD
color6   #4ABAAF
color14  #56B6C2
color7   #ACB0D0
color15  #ABB2BF

# st-style keymaps
map alt+k     scroll_line_up
map alt+j     scroll_line_down
map alt+u     scroll_page_up
map alt+d     scroll_page_down
map alt+a     set_background_opacity +0.05
map alt+s     set_background_opacity -0.05
map alt+equal change_font_size all +1
map alt+minus change_font_size all -1
map alt+c     copy_to_clipboard
map alt+v     paste_from_clipboard
map alt+l     open_url_with_hints
map alt+y     kitten hints --type url --program @
map alt+o     launch --type=clipboard --stdin-source=@last_cmd_output
map alt+e     launch --type=overlay --stdin-source=@last_cmd_output nvim -
