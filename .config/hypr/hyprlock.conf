# Blurred-screenshot lock, Tokyo Night input field.

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    outer_color = rgb(7AA2F7)
    inner_color = rgb(1A1B26)
    font_color = rgb(A9B1D6)
    check_color = rgb(9ECE6A)
    fail_color = rgb(F7768E)
    placeholder_text = <i>Password...</i>
    position = 0, -20
    halign = center
    valign = center
}
