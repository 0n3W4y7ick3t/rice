; Global settings
[general]
; Temperatures are inert under the dummy method (see adjustment-method below):
; gammastep is used here only to tell day from night, not to tint the screen.
; Kept at neutral/warm so that if the method ever changes they are sane.
temp-day=6500
temp-night=4500

; Disable the smooth fade between temperatures when Redshift starts and stops.
; 0 will cause an immediate change between screen temperatures.
; 1 will gradually apply the new screen temperature over a couple of seconds.
fade=1

; Solar elevation thresholds.
; By default, Redshift will use the current elevation of the sun to determine
; whether it is daytime, night or in transition (dawn/dusk). When the sun is
; above the degrees specified with elevation-high it is considered daytime and
; below elevation-low it is considered night.
;elevation-high=3
;elevation-low=-6

; Custom dawn/dusk intervals.
; Instead of using the solar elevation, the time intervals of dawn and dusk
; can be specified manually. The times must be specified as HH:MM in 24-hour
; format.
;dawn-time=6:00-7:45
;dusk-time=18:35-20:15

; Set the screen brightness. Default is 1.0.
;brightness=0.9
; It is also possible to use different settings for day and night
; since version 1.8.
;brightness-day=0.7
;brightness-night=0.4
; Set the screen gamma (for all colors, or each color channel
; individually)
; Neutral for the same reason as temp-day: gamma 0.9 darkened the whole day
; once it finally applied.
gamma=1.0
;gamma=0.8:0.7:0.8
; This can also be set individually for day and night since
; version 1.10.
;gamma-day=0.8:0.7:0.8
;gamma-night=0.6

; Set the location-provider: 'geoclue2', 'manual'.
; The location provider settings are in a different section.
location-provider=manual

; Set the adjustment-method: 'randr', 'vidmode', 'drm', 'wayland', 'dummy'.
; 'dummy' on purpose: this box is NVIDIA + Hyprland 0.56, where the
; zwlr_gamma_control protocol reports "Zero outputs support gamma adjustment"
; (the connector does CTM, not a gamma LUT the wlroots protocol can drive), so
; gammastep cannot tint the screen here at all. 'randr' (this file until
; 2026-09-16) only reached Xwayland's virtual CRTC and tinted nothing either,
; while tying the daemon to an X server. So gammastep earns its keep purely as
; a sunrise/sunset clock for .config/gammastep/hooks/10-color-scheme; dummy
; runs that loop and fires the hook while touching no gamma -- which also means
; it cannot die on a gamma write, the failure that froze the theme on
; 2026-09-15. Screen warmth, if ever wanted, is hyprsunset's job (it uses CTM).
adjustment-method=dummy

; Configuration of the location-provider:
; type 'gammastep -l PROVIDER:help' to see the settings.
; ex: 'gammastep -l manual:help'
; Keep in mind that longitudes west of Greenwich (e.g. the Americas)
; are negative numbers.
; Only used when gammastep is started by hand: the autostart goes through
; .scripts/gammastep-start, whose -l flag overrides this with coordinates
; derived from the system timezone. Left as Tokyo, matching that script's
; fallback.
[manual]
lat=35.7
lon=139.7

; Configuration of the adjustment-method
; type 'gammastep -m METHOD:help' to see the settings.
; The wayland method needs no options, so there is no section for it. The
; [randr] screen=0 block that used to live here went with the X11 method.

